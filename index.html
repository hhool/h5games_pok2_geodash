<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Geometry Lite — Prototype</title>
  <meta name="description" content="Geometry Lite — minimal geometric arcade prototypes. Play short levels, puzzles and skill challenges." />
  <meta property="og:title" content="Geometry Lite — Play Geometric Puzzles" />
  <meta property="og:description" content="Fast, minimal, and mobile-first geometric arcade with fluid interactions." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="css/style.css">
  <!-- Use Poppins for a geometric, rounded UI feel -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <aside class="left-nav" aria-hidden="false">
    <nav>
      <ul>
        <li class="ln-home" title="Home"></li>
        <li class="ln-clock" title="Recent"></li>
        <li class="ln-hot" title="Hot"></li>
        <li class="ln-categories" title="Categories"></li>
        <li class="ln-collection" title="Collections"></li>
      </ul>
    </nav>
  </aside>
  <header class="site-header">
    <div class="container">
      <div class="header-left">
        <a class="brand" href="index.html">Geometry Lite</a>
      </div>
      <div class="header-center">
        <input class="site-search" type="search" placeholder="Search" aria-label="Search games">
      </div>
      <div class="header-right">
        <button class="theme-toggle" aria-label="Toggle theme">☾</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <div class="hero-inner">
          <canvas id="hero-canvas" class="hero-canvas" aria-hidden="true"></canvas>
          <div class="geo-anim" aria-hidden="true">
            <!-- Decorative rotating geometry -->
            <svg viewBox="0 0 220 80" preserveAspectRatio="xMidYMid meet" class="geo-svg">
              <g class="g1" transform="translate(40,40)">
                <polygon points="-20,-18 20,-18 36,6 0,34 -36,6" fill="#C7F9F1" opacity="0.9"></polygon>
              </g>
              <g class="g2" transform="translate(110,40)">
                <circle r="18" fill="#B7E0FF" opacity="0.95"></circle>
              </g>
              <g class="g3" transform="translate(180,40)">
                <polygon points="0,-22 19,-6 12,18 -12,18 -19,-6" fill="#F6D6FF" opacity="0.95"></polygon>
              </g>
            </svg>
          </div>
          <div class="hero-copy">
            <h1>Geometry Lite — Play Geometric Puzzles</h1>
            <p class="lead">Fast, minimal, and mobile-first geometric arcade with fluid interactions.</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Player container: will host an inline iframe when a game is launched -->
    <section id="player" class="player container" aria-live="polite" style="display:none;">
      <div class="player-inner" id="player-inner">
        <!-- iframe injected by JS -->
      </div>
      <div class="player-controls">
        <button id="player-exit" class="btn">Exit</button>
      </div>
    </section>

    <section class="games container" id="games">
      <h2>Featured</h2>
      <div class="game-grid" id="game-grid">
        <!-- cards inserted by JS -->
      </div>
    </section>
  </main>

  <!-- Structured data for search engines: basic site + items -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "GeometryLite Featured Games",
    "description": "Featured geometric arcade prototypes.",
    "itemListElement": [
      {"@type":"ListItem","position":1,"url":"/g1/","item":{"@type":"VideoGame","name":"Geo Dash","description":"Fast-paced geometric runner. Dodge obstacles and survive as long as you can."}},
      {"@type":"ListItem","position":2,"url":"/g2/","item":{"@type":"VideoGame","name":"Shape Pop","description":"Pop matching shapes to clear the board. Think ahead to chain combos."}},
      {"@type":"ListItem","position":3,"url":"/g3/","item":{"@type":"VideoGame","name":"Line Rider","description":"Draw lines to guide the rider across geometric tracks."}},
      {"@type":"ListItem","position":4,"url":"/g4/","item":{"@type":"VideoGame","name":"Quad Wars","description":"Fight other quads in fast arena matches."}}
    ]
  }
  </script>

  <footer class="site-footer">
    <div class="container">© GeometryLite — Prototype</div>
  </footer>

  <!-- Modal removed: Play now opens the game inline in the player container above -->

  <script src="js/main.js"></script>
</body>
</html>
